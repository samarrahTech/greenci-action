name: 'GreenCI - AI E2E Test Agent'
description: 'AI-powered E2E test generation and self-healing for pull requests'
author: 'GreenCI'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  api-key:
    description: 'GreenCI API key (required for the hosted greenci provider; optional for BYO-LLM providers)'
    required: false
  mode:
    description: 'Operation mode: generate (PR diffs), bootstrap (foundational suite from journeys), or migrate (Cypress → Playwright)'
    required: false
    default: 'generate'
  journeys:
    description: 'Bootstrap mode: critical user journeys in plain English, one per line. Mention URL paths (e.g. /login) to have their rendered HTML captured for selector grounding.'
    required: false
    default: ''
  cypress-dir:
    description: 'Cypress tests directory (for migrate mode)'
    required: false
    default: 'cypress/e2e'
  llm-provider:
    description: "LLM provider: 'greenci' (hosted), or BYO-LLM 'anthropic' / 'openai' (your key via ANTHROPIC_API_KEY / OPENAI_API_KEY env — code never touches the GreenCI API). bedrock/azure-openai/ollama are on the roadmap and fail fast if selected."
    required: false
    default: 'greenci'
  llm-model:
    description: 'LLM model name'
    required: false
    default: ''
  aws-region:
    description: 'AWS region for Bedrock'
    required: false
    default: 'us-east-1'
  test-dir:
    description: 'Directory to save generated tests'
    required: false
    default: 'e2e'
  base-url:
    description: 'App base URL for E2E tests'
    required: false
    default: 'http://localhost:3000'
  max-retries:
    description: 'Max self-healing retries'
    required: false
    default: '2'
  auto-commit:
    description: 'Auto-commit passing tests to PR'
    required: false
    default: 'true'
  greenci-api-url:
    description: 'GreenCI API endpoint'
    required: false
    default: 'https://api.greenci.ai'
  project-id:
    description: 'GreenCI project ID for dashboard trace uploads'
    required: false
    default: ''
  github-token:
    description: 'GitHub token for PR comments and auto-commit (defaults to GITHUB_TOKEN)'
    required: false
    default: ${{ github.token }}

outputs:
  tests-generated:
    description: 'Number of tests generated'
  tests-passed:
    description: 'Number of tests passed'
  tests-failed:
    description: 'Number of tests failed'
  report-url:
    description: 'URL to the PR comment with full report'

runs:
  using: 'node20'
  main: 'dist/index.js'
