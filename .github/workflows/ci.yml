name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: samarrahTech/samarratech-workflows/.github/workflows/node-ci.yml@v1

  # The Azure DevOps task is a separate package that imports from ../src.
  # Nothing compiled it in CI, so it could stop building without anyone
  # knowing. Typecheck and bundle it on every change.
  azure-devops:
    name: Azure DevOps task builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: Typecheck and bundle the task
        working-directory: azure-devops
        run: |
          npm ci
          npm run typecheck
          npm run build
          # task.json runs dist/index.js: fail if the bundle did not land there.
          test -s dist/index.js

  dist:
    name: Check dist is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - run: npm run build

      # git status, not git diff: a build that emits a *new* bundle file leaves
      # it untracked, which git diff does not report.
      - name: Verify dist/ matches source
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit."
            echo "--- changed files ---"
            git status --porcelain dist/
            echo "--- diff (first 200 lines) ---"
            git diff dist/ | head -200
            exit 1
          fi
